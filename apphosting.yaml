# Firebase App Hosting configuration for phivonex-core-engine
# Documentation: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  cpu: 1
  memoryMiB: 1024
  minInstances: 1
  maxInstances: 10
  concurrency: 80

env:
  # ==========================================================================
  # PUBLIC APPLICATION & BLOCKCHAIN CONFIGURATION
  # ==========================================================================
  - variable: NODE_ENV
    value: "production"
    availability:
      - RUNTIME

  - variable: APP_ENV
    value: "production"
    availability:
      - BUILD
      - RUNTIME

  - variable: APP_URL
    value: "https://phivonex.online"
    availability:
      - BUILD
      - RUNTIME

  - variable: RESEND_FROM_EMAIL
    value: "support@phivonex.online"
    availability:
      - RUNTIME

  - variable: TREASURY_WALLET_ADDRESS
    value: "0x39F47C356d45eA49826a76C252794c4C83572D76"
    availability:
      - RUNTIME

  - variable: BSC_CHAIN_ID
    value: "56"
    availability:
      - BUILD
      - RUNTIME

  - variable: BSC_RPC_URL
    value: "https://bsc-dataseed.binance.org"
    availability:
      - RUNTIME

  - variable: BSC_RPC_URL_PRIMARY
    value: "https://bsc-dataseed.binance.org"
    availability:
      - RUNTIME

  - variable: BSC_RPC_URL_SECONDARY
    value: "https://bsc-dataseed1.defibit.io"
    availability:
      - RUNTIME

  - variable: DEPOSIT_CONFIRMATIONS
    value: "3"
    availability:
      - RUNTIME

  - variable: USDT_CONTRACT_ADDRESS
    value: "0x55d398326f99059ff775485246999027b3197955"
    availability:
      - BUILD
      - RUNTIME

  # ==========================================================================
  # MANDATORY PRODUCTION DATABASE SECRET (Cloud Secret Manager — RUNTIME only)
  # Run once in Firebase Cloud Shell before rolling out:
  #   firebase apphosting:secrets:set DATABASE_URL --project=phivonex-core-engine
  #   firebase apphosting:secrets:grantaccess DATABASE_URL --backend=phivonex-core-engine --project=phivonex-core-engine
  # ==========================================================================
  - variable: DATABASE_URL
    secret: DATABASE_URL
    availability:
      - RUNTIME

  # ==========================================================================
  # OPTIONAL RUNTIME SECRETS (Uncomment ONLY after creating & granting access
  # with `firebase apphosting:secrets:set <NAME>` and `grantaccess`)
  # ==========================================================================
  # - variable: GEMINI_API_KEY
  #   secret: GEMINI_API_KEY
  #   availability:
  #     - RUNTIME
  #
  # - variable: RESEND_API_KEY
  #   secret: RESEND_API_KEY
  #   availability:
  #     - RUNTIME
  #
  # - variable: PAYOUT_PRIVATE_KEY
  #   secret: PAYOUT_PRIVATE_KEY
  #   availability:
  #     - RUNTIME
